[project]
name = "cs2-faceit-highlighter"
version = "1.0.0"
description = "2D replays, highlights, stats and cinematic clips from CS2 demos, all on your own PC"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "demoparser2>=0.35",
    "zstandard>=0.22",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.uv]
package = false   # an app run from its folder (run.py), not an installable library
